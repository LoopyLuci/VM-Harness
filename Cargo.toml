[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/state",
    "crates/crypto",
    "crates/protocol",
    "crates/hypervisor",
    "crates/supervisor",
]

[workspace.package]
version = "3.0.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
pyo3 = { version = "0.29", features = ["extension-module"] }
chrono = { version = "0.4", default-features = false }
blake3 = "1"
uuid = { version = "1", features = ["v7", "serde"] }
ed25519-dalek = "2"
rand = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
