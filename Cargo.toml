[workspace]
resolver = "2"
members = [
    "crates/supervisor",
    "crates/telemetry",
    "crates/crypto",
]

[workspace.package]
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
