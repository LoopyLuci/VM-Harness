[project]
name = "vm-harness"
version = "0.2.0"
description = "VM-Harness: Enterprise virtual machine orchestration platform with Kubernetes federation, container support, zero-trust networking, and AI-powered automation"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "VM-Harness Team", email = "dev@vmharness.local"},
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "asyncssh>=2.14.0",
    "loguru>=0.7.0",
    "cryptography>=42.0.0",
    "matplotlib>=3.8.0",
    "psutil>=5.9.0",
    "PyQt5>=5.15.0",
    "aiohttp>=3.9.0",
    "docker>=7.0.0",
    "kubernetes>=30.0.0",
    "aioquic>=0.9.0",
    "zeroconf>=0.130.0",
    "tailscale>=0.1.0",
    # Pure-Python ISO9660 writer for cloud-init NoCloud seeds (vm_harness.cloudinit).
    # Portable, needs no privileges, and emits Joliet + Rock Ridge so long
    # filenames survive.
    "pycdlib>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
]

[project.scripts]
vm-harness = "vm_harness.__main__:main"
vm-harness-gui = "gui.__main__:main"
vm-harness-cli = "vm_harness.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vm_harness*"]

[tool.setuptools.package-data]
vm_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
